# Quality Check workflow for Entity Resolution Service (ERS)
# ==========================================================
# Runs on push to develop and on PRs targeting develop.
#
# Required repository secrets:
#   - SONAR_TOKEN: SonarCloud authentication token
#
# If the private ers-spec dependency fails to resolve with the default
# GITHUB_TOKEN, add a PAT as GH_TOKEN_PRIVATE_REPOS and uncomment the
# fallback section below.

name: Quality Check

on:
  push:
    branches: [develop, feature/ERS1-106/ci-setup]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"
  pull_request:
    branches: [develop, feature/ERS1-106/ci-setup]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Lint, Test & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      ferretdb:
        image: ghcr.io/ferretdb/ferretdb:2.7.0
        ports:
          - 27017:27017
        env:
          FERRETDB_POSTGRESQL_URL: postgres://ci_user:ci_password@postgres:5432/postgres

    env:
      MONGO_URI: mongodb://ci_user:ci_password@localhost:27017

    steps:
      # Checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Python & Poetry
      - name: Read Python version from pyproject.toml
        id: python-version
        run: echo "version=$(grep -m1 'python = ' pyproject.toml | grep -oP '\d+\.\d+' | head -1)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure git credentials for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        # NOTE: If GITHUB_TOKEN lacks cross-repo access, replace with:
        # git config --global url."https://x-access-token:${{ secrets.GH_TOKEN_PRIVATE_REPOS }}@github.com/".insteadOf "https://github.com/"

      # Dependency caching
      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      # Install
      - name: Install dependencies
        run: make install

      # Quality checks
      - name: Lint (Ruff)
        id: lint
        run: make lint
        continue-on-error: true

      - name: Type check (mypy)
        id: typecheck
        run: make typecheck
        continue-on-error: true

      - name: Architecture check (import-linter)
        id: architecture
        run: make check-architecture
        continue-on-error: true

      # Tests
      - name: Run all tests with coverage
        id: test
        run: make test
        continue-on-error: true
        # TODO: Replace with make test-ci once the team agrees on a target
        # that generates coverage.xml and test-results.xml for SonarCloud.

      # Clean code
      - name: Clean code check (Xenon)
        id: cleancode
        run: make clean-code
        continue-on-error: true

      # PR quality summary
      - name: Build quality summary
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo "## Quality Check Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Lint (Ruff) | ${{ steps.lint.outcome == 'success' && 'Passed' || 'Failed' }} |"
            echo "| Type check (mypy) | ${{ steps.typecheck.outcome == 'success' && 'Passed' || 'Failed' }} |"
            echo "| Architecture (import-linter) | ${{ steps.architecture.outcome == 'success' && 'Passed' || 'Failed' }} |"
            echo "| Tests + Coverage | ${{ steps.test.outcome == 'success' && 'Passed' || 'Failed' }} |"
            echo "| Clean code (Xenon) | ${{ steps.cleancode.outcome == 'success' && 'Passed' || 'Failed' }} |"
          } > quality-summary.txt

      - name: Post quality summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: quality-summary.txt
          comment-tag: quality-check

      # Fail the job if any check failed
      - name: Evaluate results
        if: always()
        run: |
          echo "Lint:         ${{ steps.lint.outcome }}"
          echo "Type check:   ${{ steps.typecheck.outcome }}"
          echo "Architecture: ${{ steps.architecture.outcome }}"
          echo "Tests:        ${{ steps.test.outcome }}"
          echo "Clean code:   ${{ steps.cleancode.outcome }}"

          if [[ "${{ steps.lint.outcome }}" != "success" || \
                "${{ steps.typecheck.outcome }}" != "success" || \
                "${{ steps.architecture.outcome }}" != "success" || \
                "${{ steps.test.outcome }}" != "success" || \
                "${{ steps.cleancode.outcome }}" != "success" ]]; then
            echo "::error::One or more quality checks failed."
            exit 1
          fi

      # SonarCloud
      - name: SonarCloud scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
