line-length = 100
target-version = "py312"

[lint]
select = ["E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "B", # bugbear
    "UP", # pyupgrade
    "SIM", # simplify
    "C90", # mccabe complexity
    "N"   # naming conventions
]
ignore = [
    "E501", # line length handled by formatter / pragmatic exceptions
]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"