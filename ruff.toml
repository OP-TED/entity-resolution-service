line-length = 100
target-version = "py312"

[lint]
select = ["E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "B", # bugbear
    "UP", # pyupgrade
    "SIM", # simplify
    "C90", # mccabe complexity
    "N",      # naming conventions
    "RUF100", # unused noqa directives
]
ignore = [
    "E501", # line length handled by formatter / pragmatic exceptions
]

[lint.per-file-ignores]
"src/ers/__init__.py" = ["N802"]  # env_property methods use UPPER_SNAKE_CASE to match env var names
"test/unit/commons/adapters/test_config_resolver.py" = ["N802"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"