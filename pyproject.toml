[project]
name = "entity-resolution-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Meaningfy",email = "hi@meaningfy.ws"}
]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "fastapi (>=0.128.5,<0.129.0)",
    "pymongo (>=4.16.0,<5.0.0)"
]

[tool.poetry]
packages = [
    { include = "ers", from = "src" },
    { include = "erspec", from = "src" } # TODO: remove once spec is released
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "linkml (>=1.9.6,<2.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "polyfactory (>=3.2.0,<4.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
