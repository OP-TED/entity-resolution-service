[project]
name = "entity-resolution-service"
version = "0.4.0"
description = "Core Python backend service for entity resolution — REST API, decision persistence, and ERE orchestration via Redis."
authors = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
maintainers = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "fastapi (>=0.128.5,<0.129.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "pydantic-settings (>=2.13.0,<3.0.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "ers-spec @ git+https://github.com/meaningfy-ws/entity-resolution-spec.git@develop",
    "pyjwt (>=2.11.0,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "linkml-runtime (>1.9.6,<2.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "urllib3 (>=2.0,<3.0)",
    "charset-normalizer (>=3.0,<4.0)",
    "chardet (>=3.0.2,<6.0.0)",
    "pandas (>=2.0,<3.0)",
]

[tool.poetry]
packages = [
    { include = "ers", from = "src" }
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "linkml (>=1.9.6,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-bdd (>=8.0,<9.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "testcontainers[redis] (>=4.13.3,<5.0.0)",
    "polyfactory (>=3.2.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]
lint = [
    "ruff (>=0.15.0,<1.0.0)",
    "mypy (>=1.15.0,<2.0.0)",
    "import-linter (>=2.3,<3.0)",
    "radon (>=6.0,<7.0)",
    "xenon (>=0.9,<1.0)",
]

