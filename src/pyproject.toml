[project]
name = "ers-core"
version = "1.1.0"
description = "Core Python backend service for entity resolution — REST API, decision persistence, and ERE orchestration via Redis."
authors = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
maintainers = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pytest",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "pydantic[email]==2.13.3",
    "fastapi==0.128.8",
    "pymongo==4.17.0",
    "uvicorn==0.41.0",
    "ers-spec @ git+https://github.com/OP-TED/entity-resolution-spec.git@release/1.1.0#subdirectory=src",
    "pyjwt==2.12.1",
    "argon2-cffi==25.1.0",
    "linkml-runtime==1.10.0",
    "redis==7.4.0",
    "urllib3==2.6.3",
    "charset-normalizer==3.4.7",
    "chardet==5.2.0",
    "pandas==2.3.3",
    "rdflib==7.6.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "opentelemetry-api==1.41.0",
    "opentelemetry-sdk==1.41.0",
    "opentelemetry-instrumentation==0.62b0",
    "opentelemetry-instrumentation-fastapi==0.62b0",
    "opentelemetry-instrumentation-pymongo==0.62b0",
    "opentelemetry-instrumentation-redis==0.62b0",
    "opentelemetry-exporter-otlp-proto-http==1.41.0",
]

[tool.poetry]
packages = [
    { include = "ers", from = "." }
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "linkml==1.10.0",
    "pre-commit==4.6.0",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-bdd==8.1.0",
    "pytest-asyncio==1.3.0",
    "testcontainers[redis]==4.14.2",
    "polyfactory==3.3.0",
    "httpx==0.28.1",
]
lint = [
    "ruff==0.15.11",
    "mypy==1.20.2",
    "import-linter==2.11",
    "radon==6.0.1",
    "xenon==0.9.3",
]
