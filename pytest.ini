[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -v
    --basetemp=/tmp/pytest
    --tb=short
    --strict-markers
log_format = %(asctime)s %(levelname)-8s %(name)s %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S
filterwarnings =
    once
    ignore
    default::Warning:ere\..*
asyncio_mode = auto
markers =
    integration: requires a running FerretDB/MongoDB instance
